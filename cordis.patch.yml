# dsh-sidebar-tidy bundle patch。
# 宿主半端负责接收客户端日志并按天写 host-YYYY-MM-DD.jsonl；可选配置见 README：
#   config:
#     logDir: 'D:/DSH-plugins/log/dsh-sidebar-tidy'
#     enabled: true
#     level: debug
#     maxFileBytes: 5242880
#     maxRecords: 200
- insert:
    - id: sidebar-tidy
      name: dsh-sidebar-tidy
      config:
        logDir: 'D:/DSH-plugins/log/dsh-sidebar-tidy'
        enabled: true
        level: debug
    # 打包融合：同一份 patch 同时挂载 dsh-better-sidebar（右侧工作台）。
    # 它作为本插件的 dependency 安装；上游自带 bundle patch，避免 profile
    # 再单独把它列进 bundles，否则会重复挂载 /sidebar/api 导致启动失败。
    - id: better-sidebar
      name: dsh-better-sidebar
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-better-sidebar' && e.options.id !== 'better-sidebar' && !e.disabled)"
