<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="侧栏精简 + 工作台：从输入状态到输出结果的流程图">
  <rect width="900" height="400" rx="22" fill="#f6f8fc"/>
  <rect x="1" y="1" width="898" height="398" rx="21" fill="none" stroke="#dce3f0" stroke-width="2"/>

  <text x="50" y="66" fill="#172033" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="700">侧栏精简 + 工作台</text>
  <text x="50" y="96" fill="#7b879c" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14">左侧栏整理、移动抽屉与右侧工作台，一次装好</text>

  <!-- left input panel -->
  <rect x="50" y="132" width="330" height="196" rx="18" fill="#ffffff" stroke="#5b7cfa" stroke-width="3"/>
  <text x="76" y="170" fill="#5b7cfa" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="700">输入 / 状态</text>

  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#39465c">
    <line x1="78" y1="202" x2="100" y2="202" stroke="#5b7cfa" stroke-width="4" stroke-linecap="round"/>
    <text x="112" y="207">左侧栏面板</text>

    <line x1="78" y1="238" x2="100" y2="238" stroke="#7a5cff" stroke-width="4" stroke-linecap="round"/>
    <text x="112" y="243">移动布局</text>

    <line x1="78" y1="274" x2="100" y2="274" stroke="#9a5b1e" stroke-width="4" stroke-linecap="round"/>
    <text x="112" y="279">三列锚点</text>
  </g>

  <!-- arrow -->
  <line x1="394" y1="230" x2="502" y2="230" stroke="#5b7cfa" stroke-width="4" stroke-linecap="round"/>
  <path d="M500 220 L514 230 L500 240" fill="none" stroke="#5b7cfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="424" y="214" fill="#8b97aa" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12">reconcile</text>

  <!-- right output panel -->
  <rect x="520" y="132" width="330" height="196" rx="18" fill="#ffffff" stroke="#2f7d4f" stroke-width="3"/>
  <text x="546" y="170" fill="#2f7d4f" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="700">输出 / 结果</text>

  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#39465c">
    <line x1="548" y1="202" x2="570" y2="202" stroke="#2f7d4f" stroke-width="4" stroke-linecap="round"/>
    <text x="582" y="207">官方原生布局</text>

    <line x1="548" y1="238" x2="570" y2="238" stroke="#7a5cff" stroke-width="4" stroke-linecap="round"/>
    <text x="582" y="243">右侧工作台</text>

    <line x1="548" y1="274" x2="570" y2="274" stroke="#9a5b1e" stroke-width="4" stroke-linecap="round"/>
    <text x="582" y="279">JSONL 日志</text>
  </g>

  <text x="50" y="370" fill="#9aa6b8" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11">DSH 0.2.2+ · 打包融合 DSH-better-sidebar · 金丝雀 fail-safe</text>
</svg>
